<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-label="Ott  ·  Multilingual Streaming project thumbnail">
  <defs>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891B2" stop-opacity=".28"/><stop offset="1" stop-color="#6366F1" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".14"/></pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="card"><rect x="1" y="1" width="478" height="148" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="480" height="150" fill="#0B1020"/>
    <rect width="480" height="150" fill="url(#tint)"/>
    <circle cx="96" cy="30" r="52" fill="#0891B2" opacity=".5" filter="url(#blur)">
      <animate attributeName="cx" values="96;202;96" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="394" cy="130" r="56" fill="#6366F1" opacity=".45" filter="url(#blur)">
      <animate attributeName="cx" values="394;288;394" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect width="480" height="150" fill="url(#dots)"/>
    
    <g transform="translate(240 63)"><line x1="-40" x2="40" y1="-38" y2="-38" stroke="#6366F1" stroke-opacity=".7" stroke-width="4" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1s" repeatCount="indefinite"/></line><line x1="-40" x2="40" y1="38" y2="38" stroke="#6366F1" stroke-opacity=".7" stroke-width="4" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1s" repeatCount="indefinite"/></line><rect x="-46" y="-30" width="92" height="60" rx="10" fill="#0B1020" fill-opacity=".6" stroke="url(#ico)" stroke-width="2.5"/><circle r="16" fill="none" stroke="#0891B2" stroke-width="1.5"><animate attributeName="r" values="16;36" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/></circle><path d="M-7 -13 L16 0 L-7 13Z" fill="#fff"/></g>
    <text x="240" y="134" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#E5E7EB" fill-opacity=".85">OTT  ·  MULTILINGUAL STREAMING</text>
  </g>

  <rect x="1" y="1" width="478" height="148" rx="16" fill="none" stroke="#fff" stroke-opacity=".10"/>
  <rect x="1" y="1" width="478" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="195.9 1028.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-1224.5" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
