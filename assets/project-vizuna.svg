<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-label="Ai  ·  Self-Improvement project thumbnail">
  <defs>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".28"/><stop offset="1" stop-color="#06B6D4" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".14"/></pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="card"><rect x="1" y="1" width="478" height="148" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="480" height="150" fill="#0B1020"/>
    <rect width="480" height="150" fill="url(#tint)"/>
    <circle cx="96" cy="30" r="52" fill="#7C3AED" opacity=".5" filter="url(#blur)">
      <animate attributeName="cx" values="96;202;96" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="394" cy="130" r="56" fill="#06B6D4" opacity=".45" filter="url(#blur)">
      <animate attributeName="cx" values="394;288;394" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect width="480" height="150" fill="url(#dots)"/>
    
    <g transform="translate(240 63)"><circle r="28" fill="none" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="r" values="28;54" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle r="28" fill="none" stroke="#06B6D4" stroke-width="1.5"><animate attributeName="r" values="28;54" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/><circle cx="46" r="3.2" fill="#06B6D4"/><circle cx="-46" r="2.2" fill="#7C3AED"/></g><g><animateTransform attributeName="transform" type="scale" values="1;1.14;1" dur="2.6s" repeatCount="indefinite"/><path d="M0 -26 C3 -9 9 -3 26 0 C9 3 3 9 0 26 C-3 9 -9 3 -26 0 C-9 -3 -3 -9 0 -26Z" fill="url(#ico)"/></g></g>
    <text x="240" y="134" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#E5E7EB" fill-opacity=".85">AI  ·  SELF-IMPROVEMENT</text>
  </g>

  <rect x="1" y="1" width="478" height="148" rx="16" fill="none" stroke="#fff" stroke-opacity=".10"/>
  <rect x="1" y="1" width="478" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="195.9 1028.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-1224.5" dur="5s" repeatCount="indefinite"/>
  </rect>
